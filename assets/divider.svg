<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 24" width="100%" height="24">
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0" />
      <stop offset="20%" stop-color="#00d2ff" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.9" />
      <stop offset="80%" stop-color="#00f5d4" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#00f5d4" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2ff">
        <animate attributeName="stop-color" values="#00d2ff;#a855f7;#00f5d4;#00d2ff" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#00f5d4;#00d2ff;#a855f7" dur="5s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <filter id="divGlow">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Central Baseline -->
  <line x1="50" y1="12" x2="850" y2="12" stroke="url(#divGrad)" stroke-width="1.5" />

  <!-- Animated Glowing Runner Beam -->
  <line x1="350" y1="12" x2="550" y2="12" stroke="url(#pulseGrad)" stroke-width="2.5" filter="url(#divGlow)">
    <animate attributeName="x1" values="100;700;100" dur="6s" repeatCount="indefinite" />
    <animate attributeName="x2" values="300;850;300" dur="6s" repeatCount="indefinite" />
  </line>

  <!-- Diamond Center Accent -->
  <g transform="translate(450, 12)">
    <polygon points="0,-6 6,0 0,6 -6,0" fill="#a855f7" filter="url(#divGlow)">
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="12s" repeatCount="indefinite" />
    </polygon>
    <circle cx="0" cy="0" r="2.5" fill="#00f5d4" />
  </g>
  <circle cx="250" cy="12" r="1.5" fill="#00d2ff" opacity="0.6" />
  <circle cx="650" cy="12" r="1.5" fill="#00f5d4" opacity="0.6" />
</svg>