<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="100%" height="260">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="actBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#0a0e14" />
    </linearGradient>

    <!-- Graph Area Gradient -->
    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.38" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0" />
    </linearGradient>

    <!-- Line Stroke Gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="55%" stop-color="#38bdf8" />
      <stop offset="78%" stop-color="#a855f7" />
      <stop offset="92%" stop-color="#00f5d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="lineGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .act-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px;
      font-weight: 700;
      fill: #00d2ff;
      letter-spacing: 0.5px;
    }
    .act-subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 12px;
      font-weight: 500;
      fill: #94a3b8;
    }
    .axis-label {
      font-family: 'Courier New', Courier, monospace;
      font-size: 11px;
      fill: #64748b;
    }
    .chip-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 11px;
      font-weight: 600;
      fill: #e2e8f0;
    }
    .chip-val {
      font-weight: 700;
      fill: #00f5d4;
    }
    @keyframes pulsePoint {
      0%, 100% { r: 4px; opacity: 1; }
      50% { r: 6.5px; opacity: 0.5; }
    }
    .pulsing-peak {
      animation: pulsePoint 2.5s infinite ease-in-out;
    }
  </style>

  <!-- Container Box -->
  <rect x="1" y="1" width="878" height="258" rx="8" fill="url(#actBg)" stroke="#1e293b" stroke-width="1.2" />

  <!-- Card Header -->
  <g transform="translate(25, 28)">
    <circle cx="0" cy="0" r="5" fill="#a855f7" filter="url(#lineGlow)" />
    <text x="14" y="4" class="act-title">2026 Contribution &amp; Development Velocity</text>
    <text x="590" y="4" class="act-subtitle">Total: <tspan fill="#00f5d4" font-weight="700">127 Contributions</tspan> • Peak: <tspan fill="#c084fc" font-weight="700">43 in 1 Day</tspan></text>
  </g>

  <!-- Horizontal Grid Lines -->
  <g opacity="0.12" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4">
    <line x1="65" y1="70" x2="840" y2="70" />
    <line x1="65" y1="105" x2="840" y2="105" />
    <line x1="65" y1="140" x2="840" y2="140" />
    <line x1="65" y1="175" x2="840" y2="175" />
  </g>

  <!-- Y-Axis Labels -->
  <text x="35" y="74" class="axis-label">45+</text>
  <text x="35" y="109" class="axis-label">30</text>
  <text x="35" y="144" class="axis-label">15</text>
  <text x="40" y="179" class="axis-label">0</text>

  <!-- Area Fill Under Curve -->
  <!-- Coordinates mapping Jan to Dec across width 65 to 840 -->
  <!-- Jan: 65, Feb: 135, Mar: 205, Apr: 275, May: 345, Jun: 415, Jul: 485, Aug: 555, Sep: 625, Oct: 695, Nov: 765, Dec: 835 -->
  <!-- Baseline is y=175 -->
  <path d="M 65 175 
           L 415 175 
           Q 555 175, 625 173 
           Q 660 170, 680 148 
           C 690 120, 700 80, 715 72 
           C 725 68, 735 110, 745 130 
           C 755 145, 765 160, 780 168 
           L 840 174 
           L 840 175 
           Z" fill="url(#areaGrad)" />

  <!-- Smooth Neon Curve Stroke -->
  <path d="M 65 175 
           L 415 175 
           Q 555 175, 625 173 
           Q 660 170, 680 148 
           C 690 120, 700 80, 715 72 
           C 725 68, 735 110, 745 130 
           C 755 145, 765 160, 780 168 
           L 840 174" 
        fill="none" stroke="url(#lineGrad)" stroke-width="2.8" filter="url(#lineGlow)" />

  <!-- Peak Data Point Glows -->
  <!-- Peak Oct 17 (43 commits) at x=715, y=72 -->
  <circle cx="715" cy="72" r="5" fill="#00d2ff" class="pulsing-peak" filter="url(#lineGlow)" />
  <circle cx="715" cy="72" r="2.5" fill="#ffffff" />
  
  <!-- Tooltip Badge on Peak -->
  <g transform="translate(675, 42)">
    <rect width="80" height="20" rx="4" fill="#090d16" stroke="#00d2ff" stroke-width="1" />
    <text x="40" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#00d2ff" text-anchor="middle">Oct 17: 43</text>
  </g>

  <!-- Minor Peak Oct 11 at x=695, y=108 -->
  <circle cx="695" cy="108" r="3.5" fill="#a855f7" filter="url(#lineGlow)" />
  <circle cx="695" cy="108" r="2" fill="#ffffff" />

  <!-- Peak Oct 23 at x=745, y=130 -->
  <circle cx="745" cy="130" r="3.5" fill="#00f5d4" filter="url(#lineGlow)" />
  <circle cx="745" cy="130" r="2" fill="#ffffff" />

  <!-- Baseline Line -->
  <line x1="65" y1="175" x2="840" y2="175" stroke="#334155" stroke-width="1.2" />

  <!-- Month Labels -->
  <g class="axis-label" transform="translate(0, 195)">
    <text x="65">Jan</text>
    <text x="135">Feb</text>
    <text x="205">Mar</text>
    <text x="275">Apr</text>
    <text x="345">May</text>
    <text x="415">Jun</text>
    <text x="485">Jul</text>
    <text x="555">Aug</text>
    <text x="625">Sep</text>
    <text x="695" fill="#00d2ff" font-weight="700">Oct</text>
    <text x="765" fill="#00f5d4" font-weight="700">Nov</text>
    <text x="825">Dec</text>
  </g>

  <!-- Bottom Metric Summary Bar -->
  <g transform="translate(25, 218)">
    <rect width="830" height="30" rx="6" fill="#131b2e" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
    <text x="25" y="19" class="chip-text">🚀 Single Day High: <tspan class="chip-val">43 Commits</tspan></text>
    <text x="235" y="19" class="chip-text">📈 Monthly Peak: <tspan class="chip-val">106 Commits (Oct)</tspan></text>
    <text x="475" y="19" class="chip-text">⚡ Public Repos: <tspan class="chip-val">13 Active</tspan></text>
    <text x="670" y="19" class="chip-text">🎯 Primary Stack: <tspan class="chip-val">TypeScript • Python</tspan></text>
  </g>
</svg>