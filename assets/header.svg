<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="100%" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1a"/>
      <stop offset="100%" stop-color="#0d1220"/>
    </linearGradient>

    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#334155">
        <animate attributeName="stop-color" values="#334155;#00d2ff;#334155" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="name" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="45%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>

    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00d2ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Card -->
  <rect x="1" y="1" width="898" height="198" rx="12" fill="url(#bg)" stroke="url(#border)" stroke-width="1"/>

  <!-- Subtle corner accents -->
  <line x1="20" y1="1" x2="20" y2="16" stroke="#00d2ff" stroke-opacity="0.15" stroke-width="1"/>
  <line x1="1" y1="20" x2="16" y2="20" stroke="#00d2ff" stroke-opacity="0.15" stroke-width="1"/>
  <line x1="880" y1="1" x2="880" y2="16" stroke="#a78bfa" stroke-opacity="0.15" stroke-width="1"/>
  <line x1="884" y1="20" x2="899" y2="20" stroke="#a78bfa" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Name -->
  <text x="450" y="82" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="44" font-weight="800" fill="url(#name)" letter-spacing="-1">Abhinav S</text>

  <!-- Thin accent line -->
  <line x1="320" y1="100" x2="580" y2="100" stroke="url(#line)" stroke-width="1"/>

  <!-- Subtitle -->
  <text x="450" y="128" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" fill="#64748b" letter-spacing="3">DEVELOPER  ·  BUILDER  ·  OPEN SOURCE</text>

  <!-- Minimal blinking cursor -->
  <rect x="622" y="116" width="8" height="15" rx="1" fill="#00d2ff" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0;0.7" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- Quiet floating dots — just 3 -->
  <circle cx="120" cy="60" r="1.5" fill="#00d2ff" opacity="0.12">
    <animate attributeName="cy" values="60;52;60" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="780" cy="140" r="1.5" fill="#a78bfa" opacity="0.12">
    <animate attributeName="cy" values="140;148;140" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="830" cy="55" r="1" fill="#00f5d4" opacity="0.08">
    <animate attributeName="cy" values="55;50;55" dur="11s" repeatCount="indefinite"/>
  </circle>
</svg>
