<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="240">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0d1424" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Neon Border Gradient (Animated) -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff">
        <animate attributeName="stop-color" values="#00d2ff;#a855f7;#00f5d4;#00d2ff" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#00f5d4;#00d2ff;#a855f7" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#00f5d4">
        <animate attributeName="stop-color" values="#00f5d4;#00d2ff;#a855f7;#00f5d4" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#00d2ff" />
      <stop offset="85%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Chip Background Gradient -->
    <linearGradient id="chipBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131c31" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0c111d" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <style>
    .code-text {
      font-family: 'Courier New', Courier, monospace;
      font-weight: 700;
      fill: #00d2ff;
      opacity: 0.08;
    }
    .status-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 11px;
      font-weight: 600;
      fill: #00f5d4;
      letter-spacing: 0.8px;
    }
    .window-title {
      font-family: 'Courier New', Courier, monospace;
      font-size: 12px;
      fill: #64748b;
    }
    .tag-title {
      font-family: 'Courier New', Courier, monospace;
      font-size: 11.5px;
      font-weight: 700;
      fill: #00d2ff;
      letter-spacing: 2px;
    }
    .name-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 42px;
      font-weight: 900;
      letter-spacing: -0.5px;
    }
    .desc-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 15.5px;
      fill: #94a3b8;
    }
    .desc-highlight {
      font-weight: 600;
      fill: #38bdf8;
    }
    .chip-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 12px;
      font-weight: 600;
      fill: #e2e8f0;
    }
    @keyframes pulseCircle {
      0%, 100% { r: 3.5px; opacity: 1; }
      50% { r: 5px; opacity: 0.4; }
    }
    .pulsing-dot {
      animation: pulseCircle 2s infinite ease-in-out;
    }
    @keyframes floatDecor {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .floating-decor {
      animation: floatDecor 5s infinite ease-in-out;
    }
  </style>

  <!-- Main Card Container -->
  <rect x="2" y="2" width="896" height="236" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.8" />

  <!-- Background Decorative Grid -->
  <g opacity="0.05">
    <line x1="0" y1="40" x2="900" y2="40" stroke="#ffffff" stroke-width="1" />
    <line x1="0" y1="80" x2="900" y2="80" stroke="#ffffff" stroke-width="1" />
    <line x1="0" y1="120" x2="900" y2="120" stroke="#ffffff" stroke-width="1" />
    <line x1="0" y1="160" x2="900" y2="160" stroke="#ffffff" stroke-width="1" />
    <line x1="0" y1="200" x2="900" y2="200" stroke="#ffffff" stroke-width="1" />
    <line x1="150" y1="0" x2="150" y2="240" stroke="#ffffff" stroke-width="1" />
    <line x1="300" y1="0" x2="300" y2="240" stroke="#ffffff" stroke-width="1" />
    <line x1="450" y1="0" x2="450" y2="240" stroke="#ffffff" stroke-width="1" />
    <line x1="600" y1="0" x2="600" y2="240" stroke="#ffffff" stroke-width="1" />
    <line x1="750" y1="0" x2="750" y2="240" stroke="#ffffff" stroke-width="1" />
  </g>

  <!-- Large Floating Background Code Glyphs -->
  <g class="floating-decor">
    <text x="740" y="115" class="code-text" font-size="82">&lt;/&gt;</text>
    <text x="630" y="180" class="code-text" font-size="62" fill="#a855f7">{ ; }</text>
  </g>

  <!-- Top Terminal Bar -->
  <path d="M 3 3 L 897 3 Q 897 3 897 32 L 3 32 Z" fill="#0d1424" fill-opacity="0.85" />
  <line x1="2" y1="33" x2="898" y2="33" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

  <!-- Window Traffic Light Dots -->
  <circle cx="24" cy="18" r="5" fill="#ff5f56" />
  <circle cx="40" cy="18" r="5" fill="#ffbd2e" />
  <circle cx="56" cy="18" r="5" fill="#27c93f" />

  <text x="80" y="22" class="window-title">abhinav@portfolio-os: ~ /dev/env</text>

  <!-- Status Pill -->
  <rect x="730" y="8" width="145" height="20" rx="10" fill="#00f5d4" fill-opacity="0.1" stroke="#00f5d4" stroke-opacity="0.4" stroke-width="1" />
  <circle cx="744" cy="18" r="3.5" fill="#00f5d4" class="pulsing-dot" filter="url(#subtleGlow)" />
  <text x="755" y="22" class="status-text">SYSTEM ONLINE</text>

  <!-- Hero Content Area -->
  <text x="36" y="65" class="tag-title">⚡ INITIALIZING ARCHITECT PROTOCOL</text>

  <!-- Name with Gradient and Subtle Glow -->
  <text x="36" y="110" class="name-title" fill="url(#titleGrad)" filter="url(#subtleGlow)">Abhinav S</text>

  <!-- Subtitle -->
  <text x="36" y="138" class="desc-title">
    <tspan class="desc-highlight">Full Stack Engineer</tspan>
    <tspan> • </tspan>
    <tspan class="desc-highlight">Python Developer</tspan>
    <tspan> • </tspan>
    <tspan class="desc-highlight">Telegram Bot Architect</tspan>
    <tspan> • </tspan>
    <tspan>AI &amp; MCP Tool Builder</tspan>
  </text>

  <!-- 4 Strategic Feature Chips -->
  <!-- Chip 1: Full Stack -->
  <g transform="translate(36, 168)">
    <rect width="195" height="42" rx="8" fill="url(#chipBg)" stroke="#00d2ff" stroke-opacity="0.35" stroke-width="1" />
    <circle cx="20" cy="21" r="10" fill="#00d2ff" fill-opacity="0.15" />
    <text x="16" y="25" font-size="12">🌐</text>
    <text x="40" y="20" class="chip-label">Full Stack APIs</text>
    <text x="40" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">React • Node • FastAPI</text>
  </g>

  <!-- Chip 2: Telegram Bots -->
  <g transform="translate(247, 168)">
    <rect width="195" height="42" rx="8" fill="url(#chipBg)" stroke="#a855f7" stroke-opacity="0.35" stroke-width="1" />
    <circle cx="20" cy="21" r="10" fill="#a855f7" fill-opacity="0.15" />
    <text x="16" y="25" font-size="12">🤖</text>
    <text x="40" y="20" class="chip-label">Telegram Bot Systems</text>
    <text x="40" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">Asyncio • Bots • Scale</text>
  </g>

  <!-- Chip 3: AI & MCP -->
  <g transform="translate(458, 168)">
    <rect width="195" height="42" rx="8" fill="url(#chipBg)" stroke="#00f5d4" stroke-opacity="0.35" stroke-width="1" />
    <circle cx="20" cy="21" r="10" fill="#00f5d4" fill-opacity="0.15" />
    <text x="16" y="25" font-size="12">🧠</text>
    <text x="40" y="20" class="chip-label">MCP &amp; AI Agents</text>
    <text x="40" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">Tool Protocol • Plugins</text>
  </g>

  <!-- Chip 4: Automation & Media -->
  <g transform="translate(669, 168)">
    <rect width="195" height="42" rx="8" fill="url(#chipBg)" stroke="#818cf8" stroke-opacity="0.35" stroke-width="1" />
    <circle cx="20" cy="21" r="10" fill="#818cf8" fill-opacity="0.15" />
    <text x="16" y="25" font-size="12">⚡</text>
    <text x="40" y="20" class="chip-label">Automated Pipelines</text>
    <text x="40" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">Media • CLI • Debloat</text>
  </g>
</svg>