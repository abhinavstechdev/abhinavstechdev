<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 145" width="100%" height="145">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="trophyCardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0.95" />
    </linearGradient>

    <!-- Gold/Cyan/Purple Rank Gradients -->
    <linearGradient id="rankGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="rankCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="100%" stop-color="#00bbf9" />
    </linearGradient>

    <linearGradient id="rankPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>

    <filter id="trophyGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .t-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 12px;
      font-weight: 700;
      fill: #ffffff;
      text-anchor: middle;
    }
    .t-desc {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 9.5px;
      fill: #94a3b8;
      text-anchor: middle;
    }
    .t-rank {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 11px;
      font-weight: 800;
      fill: #0d1117;
      text-anchor: middle;
    }
    @keyframes trophyShine {
      0%, 100% { stroke-opacity: 0.3; }
      50% { stroke-opacity: 0.9; }
    }
    .trophy-border {
      animation: trophyShine 4s infinite ease-in-out;
    }
  </style>

  <!-- Trophy 1: Telegram Bot Architect -->
  <g transform="translate(15, 8)">
    <rect width="158" height="128" rx="10" fill="url(#trophyCardBg)" stroke="#00d2ff" stroke-width="1.2" class="trophy-border" />
    <!-- Hexagon Medal -->
    <circle cx="79" cy="40" r="22" fill="#00d2ff" fill-opacity="0.12" stroke="#00d2ff" stroke-width="1.2" />
    <text x="79" y="47" font-size="22" text-anchor="middle">🤖</text>
    <!-- Rank Pill -->
    <rect x="57" y="66" width="44" height="16" rx="8" fill="url(#rankCyan)" filter="url(#trophyGlow)" />
    <text x="79" y="78" class="t-rank">S+</text>
    <!-- Text -->
    <text x="79" y="99" class="t-title">Bot Architect</text>
    <text x="79" y="113" class="t-desc">Telegram Ecosystems</text>
  </g>

  <!-- Trophy 2: AI & MCP Pioneer -->
  <g transform="translate(187, 8)">
    <rect width="158" height="128" rx="10" fill="url(#trophyCardBg)" stroke="#a855f7" stroke-width="1.2" class="trophy-border" />
    <circle cx="79" cy="40" r="22" fill="#a855f7" fill-opacity="0.12" stroke="#a855f7" stroke-width="1.2" />
    <text x="79" y="47" font-size="22" text-anchor="middle">🧠</text>
    <rect x="61" y="66" width="36" height="16" rx="8" fill="url(#rankPurple)" filter="url(#trophyGlow)" />
    <text x="79" y="78" class="t-rank">S</text>
    <text x="79" y="99" class="t-title">MCP &amp; AI Tools</text>
    <text x="79" y="113" class="t-desc">Model Context Protocol</text>
  </g>

  <!-- Trophy 3: Polyglot Coder -->
  <g transform="translate(359, 8)">
    <rect width="158" height="128" rx="10" fill="url(#trophyCardBg)" stroke="#fbbf24" stroke-width="1.2" class="trophy-border" />
    <circle cx="79" cy="40" r="22" fill="#fbbf24" fill-opacity="0.12" stroke="#fbbf24" stroke-width="1.2" />
    <text x="79" y="47" font-size="22" text-anchor="middle">🏆</text>
    <rect x="61" y="66" width="36" height="16" rx="8" fill="url(#rankGold)" filter="url(#trophyGlow)" />
    <text x="79" y="78" class="t-rank">A</text>
    <text x="79" y="99" class="t-title">Polyglot Dev</text>
    <text x="79" y="113" class="t-desc">TS • Python • PHP • Bash</text>
  </g>

  <!-- Trophy 4: Commits & Velocity -->
  <g transform="translate(531, 8)">
    <rect width="158" height="128" rx="10" fill="url(#trophyCardBg)" stroke="#00f5d4" stroke-width="1.2" class="trophy-border" />
    <circle cx="79" cy="40" r="22" fill="#00f5d4" fill-opacity="0.12" stroke="#00f5d4" stroke-width="1.2" />
    <text x="79" y="47" font-size="22" text-anchor="middle">⚡</text>
    <rect x="61" y="66" width="36" height="16" rx="8" fill="url(#rankCyan)" filter="url(#trophyGlow)" />
    <text x="79" y="78" class="t-rank">A</text>
    <text x="79" y="99" class="t-title">Sprint Velocity</text>
    <text x="79" y="113" class="t-desc">127+ Contributions</text>
  </g>

  <!-- Trophy 5: Multi-Repo Crafter -->
  <g transform="translate(703, 8)">
    <rect width="158" height="128" rx="10" fill="url(#trophyCardBg)" stroke="#818cf8" stroke-width="1.2" class="trophy-border" />
    <circle cx="79" cy="40" r="22" fill="#818cf8" fill-opacity="0.12" stroke="#818cf8" stroke-width="1.2" />
    <text x="79" y="47" font-size="22" text-anchor="middle">📦</text>
    <rect x="61" y="66" width="36" height="16" rx="8" fill="url(#rankPurple)" filter="url(#trophyGlow)" />
    <text x="79" y="78" class="t-rank">A</text>
    <text x="79" y="99" class="t-title">Repo Crafter</text>
    <text x="79" y="113" class="t-desc">13+ Public Projects</text>
  </g>
</svg>